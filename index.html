  function makeGlow(col, size) {
    const c = document.createElement("canvas");
    c.width = size;
    c.height = size;
    const g = c.getContext("2d");
    if (g) {
      const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);

      g.fillStyle = held ? "rgba(255,157,69,0.35)" : "rgba(14,9,24,0.40)";

      g.lineWidth = 2;
      g.strokeStyle = held ? "rgba(255,207,158,0.95)" : "rgba(232,223,208,0.35)";
      g.stroke();
      const fg = held ? "#fff3d6" : "rgba(232,223,208,0.88)";

        g.fillRect(b.x - 8, b.y - 9, 5, 18);
        g.fillRect(b.x + 3, b.y - 9, 5, 18);

      if (icon === "menu") {

        for (let i = 0;i < 3; i++)

        g.arc(b.x + 5, b.y - 4, 3.2, 0, Math.PI * 2);

        g.quadraticCurveTo(-w * 0.44, -h * 1.26 + bob, -facing * w * 0.1, -h * 1.32 + bob);
        g.quadraticCurveTo(facing * w * 0.46, -h * 1.26 + bob, facing * w * 0.26, -h * 0.9 + bob);
        g.quadraticCurveTo(0, -h * 1.04 + bob, -w * 0.32, -h * 0.88 + bob);
        g.closePath();
        g.fill();
        g.fillStyle = "rgba(255,244,214,0.3)";
        g.beginPath();
        g.moveTo(-facing * w * 0.04, -h * 1.24 + bob);
        g.quadraticCurveTo(-facing * w * 0.3, -h * 1.12 + bob, -facing * w * 0.26, -h * 0.94 + bob);
        g.quadraticCurveTo(-facing * w * 0.1, -h * 1.04 + bob, -facing * w * 0.04, -h * 1.24 + bob);
        g.closePath();
        g.fill();
      } else if (look.hair === 0) {
        g.strokeStyle = "rgba(255,255,255,0.08)";
        g.lineWidth = 2;
        g.beginPath();
        g.arc(0, -h * 0.88 + bob, w * 0.24, Math.PI * 1.15, Math.PI * 1.85);
        g.stroke();
        g.fillStyle = look.skin;
        g.beginPath();
        g.arc(-w * 0.28, -h * 0.86 + bob, 0.05 * w, 0, Math.PI * 2);
        g.fill();
        g.beginPath();
        g.arc(w * 0.28, -h * 0.86 + bob, 0.05 * w, 0, Math.PI * 2);
        g.fill();
      } else if (look.hair === 2) {
        g.beginPath();
        g.arc(0, -h * 0.9 + bob, w * 0.31, Math.PI, Math.PI * 2);
        g.closePath();
        g.fill();
        g.beginPath();
        g.moveTo(0.05 * w, -1.12 * h + bob);
        g.lineTo(-0.42 * w, -1.2 * h + bob);
        g.lineTo(-0.12 * w, -0.98 * h + bob);
        g.closePath();
        g.fill();
        g.beginPath();
        g.moveTo(-0.05 * w, -1.06 * h + bob);
        g.lineTo(-0.52 * w, -1.02 * h + bob);
        g.lineTo(-0.16 * w, -0.9 * h + bob);
        g.closePath();
        g.fill();
      } else if (look.hair === 3) {
        g.beginPath();
        g.arc(0, -h * 0.9 + bob, w * 0.3, Math.PI, Math.PI * 2);
        g.closePath();
        g.fill();
        g.fillStyle = hair;
        g.beginPath();
        g.arc(0, -h * 1.16 + bob, w * 0.09, 0, Math.PI * 2);
        g.fill();
      } else {
        g.beginPath();
        g.arc(0, -h * 0.9 + bob, w * 0.31, Math.PI, Math.PI * 2);
        g.closePath();
        g.fill();
        g.fillRect(-w * 0.29, -h * 0.92 + bob, 0.06 * w, 0.08 * h);
        g.fillRect(w * 0.23, -h * 0.92 + bob, 0.06 * w, 0.08 * h);
      }
      const blink = look.glasses === 0 && this.time % 3.7 < 0.12;
      if (blink) {
        g.fillStyle = "rgba(20,10,26,0.9)";
        g.fillRect(facing * 4 - 2, -h * 0.9 + bob + 1.8, 3.4, 1.2);
      } else {
        g.fillStyle = "#ffb347";
        g.fillRect(facing * 4 - 2, -h * 0.9 + bob, 3.4, 3.4);
        g.fillStyle = "rgba(255,244,214,0.85)";
        g.fillRect(facing * 4 - 1.4, -h * 0.9 + bob + 0.6, 1.1, 1.1);
      }
      if (look.beard > 0) {
        const by = -h * 0.88 + bob;
        g.fillStyle = hair;
        if (look.beard === 1) {
          g.strokeStyle = hair;
          g.lineWidth = 2.5;
          g.globalAlpha = 0.7;
          g.beginPath();
          g.arc(0, by + 0.02 * h, w * 0.26, Math.PI * 0.14, Math.PI * 0.86);
          g.stroke();
          g.globalAlpha = 1;
        } else if (look.beard === 2) {
          g.beginPath();
          g.arc(0, by + 0.05 * h, w * 0.28, Math.PI * 0.05, Math.PI * 0.95);
          g.closePath();
          g.fill();
        } else {
          g.beginPath();
          g.moveTo(-w * 0.24, by + 0.02 * h);
          g.quadraticCurveTo(-w * 0.2, by + 0.42 * h, 0, by + 0.5 * h);
          g.quadraticCurveTo(w * 0.2, by + 0.42 * h, w * 0.24, by + 0.02 * h);
          g.closePath();
          g.fill();
        }
      }
      if (king) {
        const ey = -h * 0.9 + bob;
        g.fillStyle = "#14101e";
        g.fillRect(-w * 0.26, ey - 3, w * 0.52, 6);
        g.fillStyle = "#2c1d42";
        g.fillRect(-w * 0.22, ey - 4, w * 0.18, 8);
        g.fillRect(w * 0.04, ey - 4, w * 0.18, 8);
        g.fillStyle = "rgba(255,179,71,0.55)";
        g.fillRect(-w * 0.18, ey - 2, w * 0.1, 2);
        g.fillRect(w * 0.08, ey - 2, w * 0.1, 2);
      } else if (look.glasses > 0) {
        const ey = -h * 0.9 + bob;
        if (look.glasses === 1) {
          g.fillStyle = "#14101e";
          g.fillRect(-w * 0.26, ey - 3, w * 0.52, 6);
          g.fillStyle = "#2c1d42";
          g.fillRect(-w * 0.22, ey - 4, w * 0.18, 8);
          g.fillRect(w * 0.04, ey - 4, w * 0.18, 8);
          g.fillStyle = "rgba(255,179,71,0.55)";
          g.fillRect(-w * 0.18, ey - 2, w * 0.1, 2);
          g.fillRect(w * 0.08, ey - 2, w * 0.1, 2);
        } else if (look.glasses === 2) {
          g.strokeStyle = "#cfc8bd";
          g.lineWidth = 1.5;
          g.beginPath();
          g.arc(facing * 4 - 5.5, ey + 1, 4.6, 0, Math.PI * 2);
          g.stroke();
          g.beginPath();
          g.arc(facing * 4 + 5.5, ey + 1, 4.6, 0, Math.PI * 2);
          g.stroke();
          g.beginPath();
          g.moveTo(facing * 4 - 1, ey + 1);
          g.lineTo(facing * 4 + 1, ey + 1);
          g.stroke();
        } else {
          g.fillStyle = "#14101e";
          g.fillRect(-w * 0.27, ey - 4, w * 0.54, 7);
          g.fillStyle = "#ff9d45";
          g.fillRect(-w * 0.27, ey - 1.5, w * 0.54, 2.5);
        }
      }
      const hy = -h * 0.88 + bob;
      const wr = w * 0.3;
      if (look.glamHair === "crown") {
        const bandY = hy - w * 0.42;
        g.fillStyle = "#ffd166";
        g.fillRect(-w * 0.3, bandY, w * 0.6, w * 0.16);
        g.beginPath();
        g.moveTo(-w * 0.3, bandY);
        g.lineTo(-w * 0.19, bandY - w * 0.3);
        g.lineTo(-w * 0.07, bandY);
        g.lineTo(0, bandY - w * 0.38);
        g.lineTo(w * 0.07, bandY);
        g.lineTo(w * 0.19, bandY - w * 0.26);
        g.lineTo(w * 0.3, bandY);
        g.closePath();
        g.fill();
        g.fillStyle = "rgba(255,255,255,0.35)";
        g.fillRect(-w * 0.3, bandY, w * 0.6, 1.6);
        g.fillStyle = "#ff9d45";
        g.beginPath();
        g.arc(0, bandY + w * 0.08, w * 0.07, 0, Math.PI * 2);
        g.fill();
      } else if (robe) {
        g.fillStyle = "#4e3d2c";
        g.beginPath();
        g.arc(0, hy - w * 0.06, w * 0.46, Math.PI * 0.84, Math.PI * 2.16);
        g.closePath();
        g.fill();
        g.fillStyle = "#241a10";
        g.beginPath();
        g.arc(0, hy - w * 0.05, w * 0.33, Math.PI * 1.02, Math.PI * 1.98);
        g.closePath();
        g.fill();
      } else if (moon) {
        g.fillStyle = "#14101e";
        g.beginPath();
        g.ellipse(0, hy - w * 0.2, w * 0.62, w * 0.1, 0, 0, Math.PI * 2);
        g.fill();
        g.fillRect(-w * 0.33, hy - w * 0.54, w * 0.66, w * 0.36);
        g.fillStyle = "#e8e3da";
        g.fillRect(-w * 0.33, hy - w * 0.3, w * 0.66, w * 0.07);
      } else if (farmer) {
        g.fillStyle = "#d9b166";
        g.beginPath();
        g.ellipse(0, hy - w * 0.18, w * 0.8, w * 0.14, 0, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = "#c9a04e";
        g.fillRect(-w * 0.3, hy - w * 0.46, w * 0.6, w * 0.3);
        g.beginPath();
        g.ellipse(0, hy - w * 0.46, w * 0.3, w * 0.1, 0, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = "#8a6a2a";
        g.fillRect(-w * 0.3, hy - w * 0.26, w * 0.6, w * 0.08);
      } else if (look.hat === 1) {
        const by = hy - wr * 0.72;
        g.fillStyle = "#3b2a60";
        g.beginPath();
        g.ellipse(0, by, wr * 1.5, wr * 0.34, 0, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = "#4a3576";
        g.beginPath();
        g.moveTo(-wr * 0.85, by);
        g.quadraticCurveTo(-wr * 0.15, by - wr * 1.5, wr * 0.72 + facing, by - wr * 2.3);
        g.quadraticCurveTo(wr * 0.1, by - wr * 0.62, wr * 0.9, by);
        g.closePath();
        g.fill();
        g.fillStyle = acc;
        g.fillRect(-wr * 0.85, by - wr * 0.44, wr * 1.7, wr * 0.34);
        g.fillStyle = "#5d4690";
        g.beginPath();
        g.arc(wr * 0.72 + facing, by - wr * 2.3, wr * 0.24, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = "#ffd166";
        g.beginPath();
        g.moveTo(wr * 0.34, by - wr * 1.15);
        g.lineTo(wr * 0.46, by - wr * 1.34);
        g.lineTo(wr * 0.58, by - wr * 1.15);
        g.lineTo(wr * 0.46, by - wr * 0.96);
        g.closePath();
        g.fill();
      } else if (look.hat === 2) {
        const by = hy - wr * 0.7;
        g.fillStyle = "#171126";
        g.beginPath();
        g.ellipse(0, by, wr * 1.45, wr * 0.3, 0, 0, Math.PI * 2);
        g.fill();
        g.fillRect(-wr * 0.92, by - wr * 1.95, wr * 1.84, wr * 1.95);
        g.fillStyle = "#241a38";
        g.beginPath();
        g.ellipse(0, by - wr * 1.95, wr * 0.92, wr * 0.26, 0, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = acc;
        g.fillRect(-wr * 0.92, by - wr * 0.52, wr * 1.84, wr * 0.4);
        g.strokeStyle = "rgba(255,255,255,0.10)";
        g.lineWidth = 1.5;
        g.beginPath();
        g.moveTo(-wr * 0.55, by - wr * 1.8);
        g.lineTo(-wr * 0.55, by - wr * 0.65);
        g.stroke();
      } else if (look.hat === 3) {
        g.strokeStyle = "#4e7a4a";
        g.lineWidth = 2.4;
        g.beginPath();
        g.arc(0, hy - wr * 0.18, wr * 1.04, Math.PI * 1.02, Math.PI * 1.98);
        g.stroke();
        const petals = [acc, "#f27ab5", "#e8e3da", "#f27ab5", acc];
        for (let k = 0;k < 5; k++) {
          const ang = Math.PI * (1.08 + k * 0.205);
          const fx = Math.cos(ang) * wr * 1.04;
          const fy = hy - wr * 0.18 + Math.sin(ang) * wr * 1.04;
          g.fillStyle = petals[k % petals.length];
          for (let p = 0;p < 4; p++) {
            const pa = Math.PI / 2 * p + 0.4;
            g.beginPath();
            g.arc(fx + Math.cos(pa) * 2.6, fy + Math.sin(pa) * 2.6, 2.1, 0, Math.PI * 2);
            g.fill();
          }
          g.fillStyle = "#ffd166";
          g.beginPath();
          g.arc(fx, fy, 1.7, 0, Math.PI * 2);
          g.fill();
        }
      } else if (look.hat === 4) {
        const by = hy - wr * 0.95;
        g.fillStyle = "#14101e";
        g.fillRect(-wr * 1.8, by, wr * 3.6, wr * 0.28);
        g.fillRect(-wr * 0.85, by - wr * 1.05, wr * 1.7, wr * 1.05);
        g.strokeStyle = "rgba(255,255,255,0.14)";
        g.lineWidth = 1.4;
        g.beginPath();
        g.moveTo(-wr * 1.8, by);
        g.lineTo(wr * 1.8, by);
        g.moveTo(-wr * 0.85, by - wr * 1.05);
        g.lineTo(wr * 0.85, by - wr * 1.05);
        g.stroke();
        g.fillStyle = acc;
        g.fillRect(-wr * 0.85, by - wr * 0.3, wr * 1.7, wr * 0.26);
      }
    }
    drawPetAt(g, id, x, y, t) {
      const bob = Math.sin(t * 2.6) * 2;
      if (id === "pet-orb") {
        const pulse = 0.8 + 0.2 * Math.sin(t * 4.2);
        g.globalAlpha = 0.85 * pulse;
        g.drawImage(this.glowEmber, x - 16, y - 24 - bob * 0.4, 32, 32);
        g.globalAlpha = 1;
        g.fillStyle = "#ffe9b0";
        g.beginPath();
        g.arc(x, y - 12 - bob, 4.6 * pulse + 1.2, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = "#fffbe8";
        g.beginPath();
        g.arc(x - 1.4, y - 13.4 - bob, 1.9, 0, Math.PI * 2);
        g.fill();
      } else if (id === "pet-turtle") {
        const padd = Math.sin(t * 7) * 2;
        g.fillStyle = "#7ab86a";
        g.fillRect(x - 7, y - 4 + padd + bob, 3.4, 3);
        g.fillRect(x + 4, y - 4 - padd + bob, 3.4, 3);
        g.fillStyle = "#3f7a43";
        g.beginPath();
        g.arc(x, y - 6 + bob, 8, Math.PI, Math.PI * 2);
        g.closePath();
        g.fill();
        g.fillStyle = "#2c5a30";
        g.fillRect(x - 8, y - 6 + bob, 16, 2.4);
        g.fillStyle = "#d8c98f";
        g.fillRect(x - 6, y - 3.6 + bob, 12, 2.2);
        g.fillStyle = "#7ab86a";
        g.beginPath();
        g.arc(x + 9, y - 5.4 + bob, 3.4, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = "#20263c";
        g.beginPath();
        g.arc(x + 10, y - 6 + bob, 0.9, 0, Math.PI * 2);
        g.fill();
      } else if (id === "pet-ghost") {
        const sway = Math.sin(t * 1.8) * 2.4;
        g.globalAlpha = 0.78;
        g.fillStyle = "#e6ecff";
        g.beginPath();
        g.arc(x + sway * 0.4, y - 12 - bob, 8, Math.PI, Math.PI * 2);
        g.lineTo(x + 8 + sway * 0.4, y - 4 - bob);
        g.quadraticCurveTo(x + 4 + sway * 0.4, y - 8 - bob, x + sway * 0.4, y - 3 - bob);
        g.quadraticCurveTo(x - 4 + sway * 0.4, y - 8 - bob, x - 8 + sway * 0.4, y - 4 - bob);
        g.closePath();
        g.fill();
        g.globalAlpha = 1;
        g.fillStyle = "#20263c";
        g.beginPath();
        g.arc(x - 2.4 + sway * 0.4, y - 13 - bob, 1.5, 0, Math.PI * 2);
        g.fill();
        g.beginPath();
        g.arc(x + 2.8 + sway * 0.4, y - 13 - bob, 1.5, 0, Math.PI * 2);
        g.fill();
      }
    }
    drawAuraBack(g, look, w, h) {
      if (look.glamAura === "glow") {
        const pulse = 0.24 + 0.1 * Math.sin(this.time * 3.1);
        g.globalAlpha = pulse + 0.14;
        g.drawImage(this.glowSoft, -w * 1.7, -h * 1.5, w * 3.4, h * 1.9);
        g.globalAlpha = 1;
      }
    }
    drawAuraFront(g, look, w, h) {
      if (look.glamAura === "stars") {
        for (let i = 0;i < 6; i++) {
          const a = this.time * 1.5 + i / 6 * Math.PI * 2;
          const rr = w * 0.95 + Math.sin(this.time * 1.8 + i * 1.4) * 4;
          const sx = Math.cos(a) * rr;
          const sy = -h * 0.55 + Math.sin(a) * rr * 0.5;
          const tw = 0.55 + 0.45 * Math.sin(this.time * 5 + i * 2.1);
          const r = 2.2 + tw * 2.2;
          g.fillStyle = `rgba(255,226,150,${(0.5 + 0.45 * tw).toFixed(3)})`;
          g.beginPath();
          g.moveTo(sx, sy - r);
          g.quadraticCurveTo(sx + r * 0.22, sy - r * 0.22, sx + r, sy);
          g.quadraticCurveTo(sx + r * 0.22, sy + r * 0.22, sx, sy + r);
          g.quadraticCurveTo(sx - r * 0.22, sy + r * 0.22, sx - r, sy);
          g.quadraticCurveTo(sx - r * 0.22, sy - r * 0.22, sx, sy - r);
          g.closePath();
          g.fill();
        }
      }
      if (look.glamBlade === "dual-blades") {
        for (let i = 0;i < 2; i++) {
          const a = this.time * 2.6 + i * Math.PI;
          const rr = w * 1.15;
          const bx = Math.cos(a) * rr;
          const by = -h * 0.52 + Math.sin(a) * rr * 0.42;
          g.save();
          g.translate(bx, by);
          g.rotate(a + Math.PI / 2);
          g.globalAlpha = 0.5;
          g.drawImage(this.glowSoft, -10, -24, 20, 48);
          g.globalAlpha = 1;
          g.fillStyle = "#f4f8ff";
          g.fillRect(-1.8, -17, 3.6, 30);
          g.fillStyle = "#ffd166";
          g.fillRect(-3.2, 12, 6.4, 4);
          g.globalAlpha = 0.4;
          g.fillStyle = "#e8f2ff";
          g.fillRect(-0.9, -23, 1.8, 7);
          g.restore();
        }
        g.globalAlpha = 1;
      }
    }
    drawHeroPreview(g, look, cx, footY, scale, facing, bob) {
      g.save();
      g.translate(cx, footY);
      g.scale(scale, scale);
      this.drawAuraBack(g, look, 34, 52);
      this.drawHeroBody(g, look, 34, 52, bob, facing);
      this.drawAuraFront(g, look, 34, 52);
      g.restore();
    }
    tapMap(x, y) {
      if (this.uiArm > 0)
        return;
      if (this.brief)
        return;
      const y0 = 150;
      const rh = 32;
      if (x < 70 || x > 1210)
        return;
      const i = Math.floor((y - y0) / rh);
      if (i < 0 || i >= MISSIONS.length)
        return;
      this.mapSel = i;
      const m = MISSIONS[i];
      if (this.char.level < m.reqLevel) {
        this.mapNote = `${m.name} is sealed — reach level ${m.reqLevel} first.`;
        this.mapNoteT = 2.2;
        return;
      }
      this.openBrief(m);
    }
  }

  // scripts/ember2d-standalone/entry.ts
  function boot() {
    const canvas = document.getElementById("game");
    if (!canvas)
      return;
    const audio = new AudioKit;
    const game = new Game(canvas, audio);
    game.start();
    const resize = () => {
      const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
      canvas.style.width = `${Math.floor(1280 * scale)}px`;
      canvas.style.height = `${Math.floor(720 * scale)}px`;
    };
    resize();
    window.addEventListener("resize", resize);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

</script>
